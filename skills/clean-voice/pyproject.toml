[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-voice-skill"
version = "0.1.0"
description = "Portable agent skill for speech extraction, denoising and transcript-aware editing"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
clean-voice = "clean_voice.cli:main"

[tool.setuptools]
packages = ["clean_voice"]

[tool.setuptools.package-data]
clean_voice = ["requirements/*.txt"]
