template_id: product_manager_senior
display_name: Product Manager Senior Interview
template_type: preset
version: 1
enabled: true
aliases:
  - product manager
  - pm
  - senior pm
  - 产品
  - 产品经理
  - 高级产品经理
target_role: Product Manager
role_family: product
candidate_level: senior
supported_levels:
  - mid
  - senior
  - tl
default_language: zh
default_speech_language: auto
persona_defaults:
  default_persona: 引导教练型
  round_overrides:
    intro: 引导教练型
    screening: 引导教练型
    round1: 业务结果型
    round2: 连环拷问型
    hr: 领导力评估型
question_bank_rules:
  allowed_rounds:
    - intro
    - screening
    - round1
    - round2
    - hr
  allowed_levels:
    - mid
    - senior
    - tl
  allowed_languages:
    - zh
    - en
    - bilingual
  allowed_difficulties:
    - L1
    - L2
    - L3
    - L4
    - L5
rounds:
  - round_id: intro
    label:
      en: Self Introduction
      zh: 自我介绍
    enabled: true
    order: 10
    goal: Build role fit and strongest product story anchor.
    default_language: auto
    target_question_count: 1
    focuses:
      - communication
      - project_authenticity
      - business_understanding
  - round_id: screening
    label:
      en: Screening
      zh: 初筛
    enabled: true
    order: 20
    goal: Validate ownership, scope, and authenticity of product work.
    default_language: auto
    target_question_count: 1
    focuses:
      - ownership
      - delivery_scope
      - resume_authenticity
  - round_id: round1
    label:
      en: Round 1
      zh: 第一轮
    enabled: true
    order: 30
    goal: Probe problem framing, business judgment, and user value reasoning.
    default_language: auto
    target_question_count: 2
    focuses:
      - business_understanding
      - problem_solving
      - communication
  - round_id: round2
    label:
      en: Round 2
      zh: 第二轮
    enabled: true
    order: 40
    goal: Probe tradeoffs, prioritization, and cross-team execution.
    default_language: auto
    target_question_count: 2
    focuses:
      - tradeoff_reasoning
      - cross_team_execution
      - technical_influence
  - round_id: hr
    label:
      en: HR Interview
      zh: HR 面
    enabled: true
    order: 50
    goal: Probe motivation, leadership maturity, and stability.
    default_language: auto
    target_question_count: 2
    focuses:
      - motivation
      - leadership
      - stability
